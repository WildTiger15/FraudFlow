# Render Blueprint for the read-only public showcase.
services:
  - type: web
    name: fraudflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: FRAUDFLOW_DB
        value: data/demo/fraudflow_demo.db
      - key: FRAUDFLOW_READ_ONLY
        value: "1"
